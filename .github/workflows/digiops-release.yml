name: DigiOps Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiops-release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Build and validate compact DigiOps release
        run: python scripts/build_digiops_release.py

      - name: Upload DigiOps artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
