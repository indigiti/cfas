name: DigiOps Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digiops-release-main
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate source syntax
        run: |
          python -m py_compile \
            app.py \
            wsgi.py \
            passenger_wsgi.py \
            deploy/private/scripts/cgi-gateway.py \
            deploy/private/scripts/digiops-runtime-activate.py \
            deploy/private/scripts/install-face-engine.py
          php -l deploy/public/index.php
          test -f deploy/public/.htaccess

      - name: Validate /cfas/ relative routing
        run: |
          if grep -RInE "(fetch|postJSON)\(['\"]/(api|static)/" static templates; then
            echo 'Root-relative app URLs found. CFAS must remain deployable under /cfas/.' >&2
            exit 1
          fi
          grep -q 'static/app.js' templates/index.html
          grep -q 'static/styles.css' templates/index.html

      - name: Build DigiOps split release
        run: |
          set -eu
          rm -rf release
          mkdir -p \
            release/public/static \
            release/private/templates \
            release/private/static \
            release/private/scripts \
            release/private/packages/runtime \
            release/private/.runtime-home \
            release/private/run/tmp

          cp deploy/public/index.php release/public/index.php
          cp deploy/public/.htaccess release/public/.htaccess
          cp static/app.js static/styles.css static/admin.css release/public/static/

          cp app.py wsgi.py passenger_wsgi.py release/private/
          cp requirements.txt requirements-runtime.txt requirements-face.txt release/private/
          cp templates/index.html release/private/templates/
          cp static/app.js static/styles.css static/admin.css release/private/static/
          cp deploy/private/scripts/cgi-gateway.py release/private/scripts/
          cp deploy/private/scripts/digiops-runtime-activate.py release/private/scripts/

          # Cloudways must not need pip, ensurepip, python3-venv, sudo, or apt.
          # Build the complete Flask + DeepFace runtime in CI and ship it.
          python -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --upgrade \
            --target release/private/packages/runtime \
            -r requirements.txt

          # Pre-fetch the configured ArcFace model so the first browser face
          # verification does not need a long model download on Cloudways.
          HOME="$PWD/release/private/.runtime-home" \
          PYTHONPATH="$PWD/release/private/packages/runtime" \
          python -S - <<'PY'
          from deepface import DeepFace
          DeepFace.build_model('ArcFace')
          print('ArcFace model is bundled')
          PY

          cat > release/private/RELEASE.json <<EOF
          {
            "artifact": "digiops-release",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "application_url": "/cfas/",
            "public_path": "public_html/cfas/",
            "private_path": "private_html/cfas/",
            "public_entrypoint": "index.php",
            "runtime_activation": "scripts/digiops-runtime-activate.py",
            "request_gateway": "scripts/cgi-gateway.py",
            "python_runtime": "fully-bundled",
            "backend": "request-driven-no-daemon"
          }
          EOF

      - name: Validate packaged request runtime
        run: |
          set -eu
          PRIVATE="$PWD/release/private"
          export HOME="$PRIVATE/.runtime-home"
          export TMPDIR="$PRIVATE/run/tmp"
          export PYTHONPATH="$PRIVATE/packages/runtime:$PRIVATE"

          python -S - <<'PY'
          import importlib.util
          import flask
          import PIL
          import deepface
          from pathlib import Path

          private = Path('release/private').resolve()
          assert (private / 'packages/runtime/deepface').is_dir()
          assert (private / '.runtime-home/.deepface/weights').is_dir()

          path = private / 'scripts' / 'digiops-runtime-activate.py'
          spec = importlib.util.spec_from_file_location('digiops_runtime_activate', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.ROOT == private, (module.ROOT, private)
          print('Bundled Flask/DeepFace runtime imports successfully')
          PY

          REQUEST_METHOD=GET \
          QUERY_STRING='' \
          CONTENT_TYPE='' \
          CONTENT_LENGTH=0 \
          SCRIPT_NAME=/cfas \
          PATH_INFO=/api/config \
          REQUEST_URI=/cfas/api/config \
          SERVER_NAME=localhost \
          SERVER_PORT=443 \
          SERVER_PROTOCOL=HTTP/1.1 \
          SERVER_SOFTWARE=CI \
          GATEWAY_INTERFACE=CGI/1.1 \
          REMOTE_ADDR=127.0.0.1 \
          HTTPS=on \
          HTTP_HOST=localhost \
          HTTP_X_FORWARDED_HOST=localhost \
          HTTP_X_FORWARDED_PROTO=https \
          HTTP_X_FORWARDED_PREFIX=/cfas \
          python -S release/private/scripts/cgi-gateway.py > /tmp/cfas-cgi.out

          grep -q 'Status: 200' /tmp/cfas-cgi.out
          tr -d ' ' < /tmp/cfas-cgi.out | grep -q '"ok":true'

          if grep -RInE '127\.0\.0\.1:8765|gunicorn|"-m", "venv"' \
            release/public/index.php \
            release/private/scripts/cgi-gateway.py \
            release/private/scripts/digiops-runtime-activate.py; then
            echo 'Release still depends on a persistent Python daemon or venv.' >&2
            exit 1
          fi

          # Importing the app intentionally initializes runtime files. They are
          # test artifacts only and must never be shipped in the release.
          rm -rf release/private/data

      - name: Validate exact DigiOps artifact contract
        run: |
          set -eu
          test -d release/public
          test -d release/private
          if [ ! -f release/public/index.html ] && [ ! -f release/public/index.php ]; then
            echo 'ENTRYPOINT_MISSING: DigiOps requires public/index.html or public/index.php' >&2
            exit 1
          fi
          test -f release/public/.htaccess
          test -f release/private/scripts/digiops-runtime-activate.py
          test -f release/private/scripts/cgi-gateway.py
          test -f release/private/app.py
          test -d release/private/packages/runtime/flask
          test -d release/private/packages/runtime/deepface
          test ! -e release/public/data
          test ! -e release/private/data
          test ! -e release/private/.env
          find release/public -maxdepth 3 -type f -print | sort
          find release/private -maxdepth 3 -type f -print | sort | head -200

      - name: Upload DigiOps artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
